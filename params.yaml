bounds:
  field_share_farmed_within_radius:
    kind: BOUND
    low: 0.25
    central: 0.5
    high: 1.0
    why: "Share of cropland around the home yard that the operation itself farms. 1.0 is the logical maximum (one contiguous block); 0.25 means neighbors farm three of every four acres nearby. Enters only the short field-to-bin leg."
  fall_share_intensive_tillage:
    kind: BOUND
    low: 0.0
    central: 0.5
    high: 1.0
    why: "Share of Census intensive-tillage acres tilled in Oct-Nov rather than spring. Logical limits. Enters only the fall farm-fuel denominator."
  fall_share_nh3:
    kind: BOUND
    low: 0.0
    central: 0.5
    high: 1.0
    why: "Share of corn N applied as fall anhydrous. Logical limits. NDSU guidance bars fall NH3 before Oct 1 (src3_ndsu_guidelines_fall_n_application.html), so any fall NH3 falls in the window."
  calves_shipped_in_window:
    kind: BOUND
    low: 0.0
    central: 0.5
    high: 1.0
    why: "Share of the calf crop shipped Sept 29-Nov 30. NDSU calls fall the 'heavy fall calf marketing season' (src2_ndsu_2019_cattle_marketing_advice.html); no monthly count is published."
  risk_acceptance:
    kind: ASSUMPTION
    low: 1.0
    central: 1.0
    high: 1.0
    why: "Author's choice: every operator with dyed fuel on hand uses it on-road. Federal penalty exposure remains (no IRS relief as of Oct 2, 2026), so this is an upper bound on this factor; actual use could be lower."
