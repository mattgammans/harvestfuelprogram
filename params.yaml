# Inputs for analysis/. Two kinds of entries:
#   inputs:  sourced values (source string gives report, table/page, and the local file in data/raw/)
#   bounds:  the few quantities no source measures. Each is labeled BOUND (logical limits of the quantity,
#            midpoint as central; used only where the whole term is shown to be small) or SCENARIO
#            (behavioral, not estimable before the fact; results are reported across its range).
# Every model parameter is DERIVED from these in analysis/derive.py, which records how
# (see outputs/derived_params.csv and appendix section A8).

